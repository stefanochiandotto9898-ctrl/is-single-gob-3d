let az=.8,el=.43,dist=15,target=new T.Vector3(.25,1.85,.5);function orient(){el=Math.max(.08,Math.min(1.4,el));camera.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(az)*Math.cos(el));camera.lookAt(target)}orient();document.getElementById('reset').onclick=()=>{az=.8;el=.43;dist=15;orient()};let pts=new Map(),pinch=null;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null});renderer.domElement.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId);if(pts.size===1){az-=(e.clientX-old.x)*.007;el+=(e.clientY-old.y)*.007;orient()}else{let all=[...pts.values()];let d=Math.hypot(all[0].x-all[1].x,all[0].y-all[1].y);if(pinch!==null){dist*=pinch/d;dist=Math.max(6,Math.min(28,dist));orient()}pinch=d}pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});for(let event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,e=>{pts.delete(e.pointerId);pinch=null});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(28,dist+e.deltaY*.015));orient()},{passive:true});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function frame(now){requestAnimationFrame(frame);let delta=Math.min(.05,(now-last)/1000);last=now;if(playing){t=(t+delta*speed/22)%1;update()}renderer.render(scene,camera)}update();requestAnimationFrame(frame);
